<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习小屋 · 学习计划日历</title>
  <style>
    :root { --ink:#243047; --muted:#748096; --paper:#fffdf9; --surface:#fff; --line:#e5eaf2; --rose:#e87898; --rose-soft:#fff0f4; --blue:#7097e9; --blue-soft:#eef4ff; --gold:#e9ad4d; --violet:#9a7bdd; --green:#61aa82; --danger:#c85361; --shadow:0 12px 35px rgba(60,75,110,.09); }
    * { box-sizing:border-box; }
    body { min-width:320px; margin:0; color:var(--ink); font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:radial-gradient(circle at 8% 0%,#fff2e9 0 15%,transparent 34%),radial-gradient(circle at 95% 7%,#eef5ff 0 15%,transparent 36%),var(--paper); }
    button,input,select { font:inherit; } button { cursor:pointer; }
    .app-shell { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:30px 0 64px; }
    .back-link { display:inline-flex; margin-bottom:22px; color:#657188; font-size:13px; text-decoration:none; }.back-link:hover { color:var(--ink); }
    .app-header { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:25px; }.eyebrow { margin:0 0 5px; color:var(--rose); font-size:12px; font-weight:800; letter-spacing:.13em; } h1 { margin:0; font-family:Georgia,"Songti SC",serif; font-size:clamp(30px,5vw,44px); letter-spacing:.02em; }.subtitle { margin:8px 0 0; color:var(--muted); font-size:14px; }
    .primary-button,.secondary-button,.tab,.month-button,.icon-button { border:0; transition:transform .15s ease,box-shadow .15s ease,background .15s ease; }.primary-button { padding:12px 17px; border-radius:13px; color:#fff; background:var(--ink); box-shadow:0 8px 18px rgba(36,48,71,.2); font-weight:800; }.primary-button:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 11px 22px rgba(36,48,71,.25); }.primary-button:disabled { cursor:wait; opacity:.62; }
    .view-tabs { display:flex; width:fit-content; margin-bottom:14px; padding:6px; gap:8px; border:1px solid var(--line); border-radius:15px; background:rgba(255,255,255,.74); box-shadow:0 4px 14px rgba(50,61,90,.04); }.tab { padding:9px 16px; border-radius:10px; color:var(--muted); background:transparent; font-weight:700; }.tab.active { color:#fff; background:var(--ink); box-shadow:0 4px 10px rgba(36,48,71,.16); }
    .sync-status { min-height:20px; margin:0 0 12px; color:#527862; font-size:13px; font-weight:700; }.sync-status.error { color:var(--danger); }
    .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }.metric-card,.panel { border:1px solid var(--line); border-radius:20px; background:rgba(255,255,255,.88); box-shadow:var(--shadow); }.metric-card { position:relative; min-height:130px; padding:20px; overflow:hidden; }.metric-card::after { position:absolute; right:-28px; bottom:-38px; width:95px; height:95px; border-radius:50%; content:""; opacity:.8; }.metric-card.rose::after { background:#ffd8e1; }.metric-card.blue::after { background:#dce8ff; }.metric-card.gold::after { background:#ffedc7; }.metric-label { color:var(--muted); font-size:13px; font-weight:700; }.metric-value { position:relative; z-index:1; margin-top:11px; font-size:32px; line-height:1; font-weight:900; letter-spacing:-.04em; }.rose .metric-value { color:#d86282; }.blue .metric-value { color:#4d75cf; }.gold .metric-value { color:#d69129; }.metric-note { position:relative; z-index:1; margin-top:9px; color:var(--muted); font-size:12px; }
    .content-grid { display:grid; grid-template-columns:minmax(270px,.88fr) minmax(0,1.45fr); gap:16px; margin-top:16px; }.panel { padding:20px; }.panel-header,.month-controls { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }.panel-title,.month-title { margin:0; font-size:17px; }.panel-hint { color:var(--muted); font-size:12px; }
    .plan-list { display:grid; gap:10px; }.plan-card { position:relative; padding:14px 42px 14px 15px; border:1px solid var(--line); border-left:4px solid var(--rose); border-radius:12px; background:#fff; }.plan-card.blue { border-left-color:var(--blue); }.plan-card.gold { border-left-color:var(--gold); }.plan-card.violet { border-left-color:var(--violet); }.plan-card.green { border-left-color:var(--green); }.plan-card h3 { margin:0; font-size:15px; }.plan-card p { margin:5px 0 0; color:var(--muted); font-size:12px; line-height:1.55; }.tag-row { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }.tag { padding:3px 7px; border-radius:999px; color:#5f6b83; background:#f4f6fa; font-size:11px; }.student-tag { display:inline-block; padding:3px 7px; border-radius:999px; font-size:11px; font-weight:800; }.student-tag.rose { color:#c85472; background:var(--rose-soft); }.student-tag.blue { color:#4670c8; background:var(--blue-soft); }.student-tag.gold { color:#a96f12; background:#fff6e5; }.student-tag.violet { color:#7459b2; background:#f3efff; }.student-tag.green { color:#43835f; background:#ebf8f0; }.delete-plan { position:absolute; top:10px; right:9px; width:28px; height:28px; border:0; border-radius:8px; color:#a2aabd; background:transparent; font-size:17px; }.delete-plan:hover { color:#d85c5c; background:#fff0f0; }
    .month-actions { display:flex; gap:5px; }.month-button { width:30px; height:30px; border-radius:8px; color:var(--ink); background:#f4f6fa; font-weight:900; }.month-button:hover { background:#e8edf7; }.weekdays,.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }.weekday { padding:2px 0 5px; color:#97a1b2; font-size:11px; font-weight:800; text-align:center; }.day { min-height:92px; padding:6px; overflow:hidden; border:1px solid #edf0f5; border-radius:10px; background:#fff; }.day.muted { opacity:.55; background:#fafbfc; }.day.today { border-color:var(--gold); box-shadow:inset 0 0 0 1px rgba(244,183,85,.25); }.day-number { display:block; color:#6e7890; font-size:11px; font-weight:800; }.event-chip { display:block; width:100%; margin-top:4px; padding:3px 4px; overflow:hidden; border:0; border-radius:5px; color:#fff; font-size:10px; line-height:1.25; text-align:left; text-overflow:ellipsis; white-space:nowrap; }.event-chip.rose { background:var(--rose); }.event-chip.blue { background:var(--blue); }.event-chip.gold { background:var(--gold); }.event-chip.violet { background:var(--violet); }.event-chip.green { background:var(--green); }.rest-note { margin-top:5px; color:#a8afbb; font-size:9px; line-height:1.2; }.calendar-legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; color:var(--muted); font-size:12px; }.legend-dot { display:inline-block; width:8px; height:8px; margin-right:4px; border-radius:50%; }.legend-dot.rose { background:var(--rose); }.legend-dot.blue { background:var(--blue); }
    .empty-state { display:grid; min-height:310px; padding:36px; place-items:center; border:1px dashed #d6ddea; border-radius:18px; background:rgba(255,255,255,.54); text-align:center; }.empty-icon { font-size:42px; }.empty-state h2 { margin:10px 0 6px; font-size:20px; }.empty-state p { max-width:320px; margin:0 0 17px; color:var(--muted); font-size:13px; line-height:1.65; }
    dialog { width:min(560px,calc(100% - 28px)); max-height:min(760px,calc(100% - 28px)); padding:0; overflow:auto; border:0; border-radius:22px; color:var(--ink); box-shadow:0 22px 70px rgba(26,37,60,.27); } dialog::backdrop { background:rgba(27,35,55,.38); backdrop-filter:blur(3px); }.dialog-content { padding:25px; }.dialog-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:15px; }.dialog-heading h2 { margin:0; font-size:22px; }.dialog-heading p { margin:5px 0 0; color:var(--muted); font-size:13px; }.icon-button { width:31px; height:31px; border-radius:9px; color:#68748a; background:#f3f5f8; font-size:21px; line-height:1; }.form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:21px; }.form-field { display:grid; gap:6px; }.form-field.wide { grid-column:1 / -1; }.form-field label { color:#59657a; font-size:12px; font-weight:800; }.form-field input,.form-field select { width:100%; padding:10px 11px; border:1px solid #dfe5ef; border-radius:9px; color:var(--ink); background:#fff; outline:none; }.form-field input:focus,.form-field select:focus { border-color:#9cb4ef; box-shadow:0 0 0 3px #edf2ff; }.form-help { margin:0; color:var(--muted); font-size:11px; line-height:1.5; }.form-error { min-height:18px; margin:14px 0 0; color:var(--danger); font-size:12px; font-weight:700; }.dialog-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:13px; }.secondary-button { padding:10px 14px; border-radius:10px; color:#58647a; background:#f1f3f7; font-weight:800; }
    @media (max-width:760px) { .app-shell { width:min(100% - 22px,620px); padding-top:22px; }.app-header { align-items:flex-start; flex-direction:column; gap:15px; }.primary-button { width:100%; }.view-tabs { width:100%; overflow-x:auto; }.tab { flex:1 0 auto; padding-inline:13px; }.summary-grid,.content-grid,.form-grid { grid-template-columns:1fr; }.panel { padding:15px; }.day { min-height:72px; padding:4px; }.event-chip { padding:2px; font-size:9px; }.weekdays,.calendar-grid { gap:3px; }.form-field.wide { grid-column:auto; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <a class="back-link" href="/">← 返回项目首页</a>
    <header class="app-header">
      <div><p class="eyebrow">LEARNING PLANS</p><h1>学习小屋</h1><p class="subtitle">把每个人的学习安排，放进一张清晰的日历里。</p></div>
      <div><button id="open-people-dialog" class="secondary-button" type="button">人物管理</button><button id="open-plan-dialog" class="primary-button" type="button">＋ 新增计划</button></div>
    </header>
    <nav class="view-tabs" aria-label="查看范围">
      <button class="tab active" data-view="overview" type="button">总览</button>
      <span id="person-tabs"></span>
      <button class="tab" data-view="calendar" type="button">日历</button>
    </nav>
    <p id="sync-status" class="sync-status" role="status"></p>
    <main id="app-content" aria-live="polite"></main>
  </div>

  <dialog id="plan-dialog">
    <form id="plan-form" class="dialog-content" novalidate>
      <div class="dialog-heading"><div><h2>新增学习计划</h2><p>课程会依照学习／休息循环自动排入日历。</p></div><button id="close-plan-dialog" class="icon-button" type="button" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <div class="form-field"><label for="person">人物</label><select id="person" name="personId" required></select></div>
        <div class="form-field"><label for="subject">学习科目</label><input id="subject" name="subject" required maxlength="30" placeholder="例如：数学思维"></div>
        <div class="form-field wide"><label for="location">学习地点</label><input id="location" name="location" required maxlength="50" placeholder="例如：家中书房、音乐教室"></div>
        <div class="form-field"><label for="start-date">开始日期</label><input id="start-date" name="startDate" type="date" required></div>
        <div class="form-field"><label for="start-time">开始时间</label><input id="start-time" name="startTime" type="time" required></div>
        <div class="form-field"><label for="end-time">结束时间</label><input id="end-time" name="endTime" type="time" required></div>
        <div class="form-field"><label for="study-days">连续学习天数</label><input id="study-days" name="studyDays" type="number" required min="1" step="1" value="5"></div>
        <div class="form-field"><label for="rest-days">连续休息天数</label><input id="rest-days" name="restDays" type="number" required min="0" step="1" value="1"></div>
        <div class="form-field"><label for="target-days">目标学习天数</label><input id="target-days" name="targetStudyDays" type="number" required min="1" step="1" value="18"></div>
        <div class="form-field wide"><p class="form-help">例如：学习 5 天、休息 1 天、目标 18 天，会一直循环到完成第 18 个学习日。</p></div>
      </div>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="cancel-plan" class="secondary-button" type="button">取消</button><button id="save-plan" class="primary-button" type="submit">保存计划</button></div>
    </form>
  </dialog>
  <dialog id="people-dialog"><div class="dialog-content"><div class="dialog-heading"><div><h2>人物管理</h2><p>人物仅属于当前登录账号。</p></div><button id="close-people-dialog" class="icon-button" type="button" aria-label="关闭">×</button></div><form id="person-form" class="form-grid"><div class="form-field wide"><label for="person-name">人物名称</label><input id="person-name" maxlength="30" required placeholder="例如：小明"></div><div class="form-field wide"><button class="primary-button" type="submit">新增人物</button></div></form><p id="person-error" class="form-error" role="alert"></p><div id="people-list" class="plan-list"></div></div></dialog>
  <script type="module" src="/study-plan-client.js"></script>
</body>
</html>
