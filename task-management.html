<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事项管理 | AI Life</title><style>:root{color-scheme:dark;--b:#07131f;--p:#0d2331;--l:#285062;--c:#57e5f5;--t:#edfaff;--m:#91b2c0}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Arial}.top{height:62px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}a{color:var(--c)}.app{display:grid;grid-template-columns:185px 1fr;min-height:calc(100vh - 62px)}nav{padding:18px 10px;border-right:1px solid var(--l)}button,select,input,textarea{font:inherit}nav button{width:100%;border:0;border-radius:7px;padding:11px;text-align:left;background:transparent;color:var(--m)}nav button.active{background:#164152;color:white}main{padding:24px}.tools{display:flex;justify-content:space-between;margin-bottom:20px}.button,.tools select{padding:8px 11px;border:1px solid var(--l);border-radius:6px;background:var(--p);color:var(--t)}.primary{background:var(--c);color:#06202b}.layout{display:grid;grid-template-columns:1fr 300px;gap:14px}.panel,.person{padding:16px;border:1px solid var(--l);border-radius:10px;background:#0b1d29}.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.person{border-top:4px solid var(--color)}label{display:grid;gap:4px;color:var(--m)}form{display:grid;gap:10px}input,textarea,select{padding:8px;background:var(--b);border:1px solid var(--l);color:var(--t);border-radius:5px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog{border:1px solid var(--l);background:#0b1d29;color:var(--t);border-radius:10px;width:min(560px,94vw)}#warning-panel button{width:100%;margin:6px 0;padding:9px;text-align:left;border:0;border-left:3px solid #ff7f88;background:#321d28;color:white}@media(max-width:900px){.app{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-bottom:1px solid var(--l)}nav button{width:auto;white-space:nowrap}.layout{grid-template-columns:1fr}}@media(max-width:540px){.twocol{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="/">← AI LIFE / 项目首页</a><b>事项管理</b></header><div class="app"><nav><button class="active" data-view="command">项目指挥中心</button><button data-view="timeline">时间线</button><button data-view="tasks">任务清单</button><button data-view="network">依赖网络</button><button data-view="board">状态看板</button><button data-view="people">责任人</button><button data-view="logs">操作日志</button></nav><main><div class="tools"><select aria-label="负责人筛选" id="assignee-filter"><option value="">全部负责人</option></select><button class="button primary" id="new-task">＋ 新建事项</button></div><div class="layout"><section id="content"></section><aside class="panel"><h3>冲突与预警</h3><div id="warning-panel"></div></aside></div></main></div><dialog id="task-dialog"><form id="task-form"><h2 id="task-title">新建事项</h2><label>事项名称<input name="title" required maxlength="160"></label><label>描述<textarea name="description"></textarea></label><div class="twocol"><label>负责人<select name="assigneeId"><option value="">未分配</option></select></label><label>状态<select name="status"><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="completed">已完成</option><option value="blocked">阻塞</option></select></label><label>开始日期<input name="startDate" type="date"></label><label>结束日期<input name="endDate" type="date"></label><label>预计工时<input name="estimatedHours" type="number" min="0" step="0.5" value="0"></label><label>实际工时<input name="actualHours" type="number" min="0" step="0.5" value="0"></label><label>优先级<select name="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></label><label>里程碑<input name="isMilestone" type="checkbox"></label></div><div><button class="button primary">保存</button><button type="button" class="button" id="cancel">取消</button></div></form></dialog><dialog id="person-dialog"><form id="person-form"><h2 id="person-title">新增责任人</h2><label>姓名<input name="name" required maxlength="80"></label><div class="twocol"><label>颜色<input name="color" type="color" value="#38BDF8"></label><label>每日容量（小时）<input name="dailyCapacityHours" type="number" min="0.5" step="0.5" value="8"></label></div><div><button class="button primary">保存</button><button type="button" class="button" id="person-cancel">取消</button></div></form></dialog><script type="module" src="/task-management-client.js"></script></body></html>
