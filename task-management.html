<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事项管理 | AI Life</title><style>
:root{color-scheme:dark;--bg:#07131f;--panel:#0d2331;--line:#285062;--cyan:#57e5f5;--text:#edfaff;--muted:#91b2c0;--red:#ff7f88;--yellow:#f5bf4e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123747,var(--bg) 45%);color:var(--text);font:14px "PingFang SC",Arial,sans-serif}button,select,input,textarea{font:inherit}button{cursor:pointer}.top{height:62px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#091b2b}.top a{color:var(--cyan);text-decoration:none}.app{display:grid;grid-template-columns:185px 1fr;min-height:calc(100vh - 62px)}nav{padding:18px 10px;border-right:1px solid var(--line)}nav button{width:100%;text-align:left;border:0;border-radius:7px;padding:11px;background:transparent;color:var(--muted)}nav button.active{background:#164152;color:#fff;box-shadow:inset 2px 0 var(--cyan)}main{padding:24px;min-width:0}.tools{display:flex;gap:8px;justify-content:space-between;margin-bottom:20px}.tools button,.tools select,.button{padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}.button.primary{background:var(--cyan);color:#06202b;border-color:var(--cyan);font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.panel{border:1px solid var(--line);border-radius:10px;background:#0b1d29;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:var(--panel);border-radius:8px}.stat b{display:block;font-size:26px;margin-top:7px}.muted{color:var(--muted)}#warning-panel button{width:100%;text-align:left;margin-top:8px;padding:10px;border:0;border-left:3px solid var(--red);background:#321d28;color:var(--text)}#warning-panel button.warning{border-color:var(--yellow);background:#342b19}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.column{min-height:280px;padding:10px;background:#0a1924;border:1px solid var(--line);border-radius:8px}.card{padding:10px;margin-top:8px;background:var(--panel);border-radius:6px;cursor:grab}.focused{outline:2px solid var(--cyan)}.timeline-row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.bar{height:20px;border-radius:4px;background:#257d96}.network{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.node{padding:12px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;bottom:18px;right:18px;padding:10px;background:#30202a;border:1px solid var(--red);display:none}dialog{border:1px solid var(--line);border-radius:10px;background:#0b1d29;color:var(--text);width:min(560px,94vw)}form{display:grid;gap:10px}label{display:grid;gap:4px;color:var(--muted)}input,textarea,select{padding:8px;background:#07131f;border:1px solid var(--line);color:var(--text);border-radius:5px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:900px){.app{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}.layout{grid-template-columns:1fr}.stats,.board{grid-template-columns:repeat(2,1fr)}main{padding:14px}}@media(max-width:540px){.stats,.board,.twocol{grid-template-columns:1fr}}
</style></head><body><header class="top"><a href="/">← AI LIFE / 项目首页</a><b>事项管理</b></header><div class="app"><nav><button class="active" data-view="command">项目指挥中心</button><button data-view="timeline">时间线</button><button data-view="tasks">任务清单</button><button data-view="network">依赖网络</button><button data-view="board">状态看板</button><button data-view="logs">操作日志</button></nav><main><div class="tools"><select aria-label="负责人筛选" id="assignee-filter"><option value="">全部负责人</option></select><button class="button primary" id="new-task">＋ 新建事项</button></div><div class="layout"><section id="content"></section><aside class="panel"><h3>冲突与预警</h3><div id="warning-panel" aria-live="polite"></div></aside></div></main></div><output id="toast" class="toast" role="status"></output><dialog id="task-dialog"><form id="task-form"><h2 id="task-title">新建事项</h2><label>事项名称<input name="title" required maxlength="160"></label><label>描述<textarea name="description"></textarea></label><div class="twocol"><label>负责人<select name="assigneeId"></select></label><label>状态<select name="status"><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="completed">已完成</option><option value="blocked">阻塞</option></select></label><label>开始日期<input name="startDate" type="date"></label><label>结束日期<input name="endDate" type="date"></label><label>预计工时<input name="estimatedHours" type="number" min="0" step="0.5" value="0"></label><label>实际工时<input name="actualHours" type="number" min="0" step="0.5" value="0"></label><label>优先级<select name="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></label><label>里程碑<input name="isMilestone" type="checkbox"></label></div><div><button class="button primary">保存</button><button class="button" type="button" id="cancel">取消</button></div></form></dialog><script type="module" src="/task-management-client.js"></script></body></html>
