<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173d2a" />
  <link rel="manifest" href="/health-manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/health-icon.svg" />
  <title>腹型减脂 | AI Life</title>
  <style>
    :root { --ink:#173d2a; --green:#2c8054; --mint:#eaf7ee; --line:#d7e6dc; --text:#17241d; --muted:#617369; --danger:#b24040; --card:#fff; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f8f5; }
    .page { width:min(1120px,calc(100% - 28px)); margin:auto; padding:24px 0 92px; } header { display:flex; justify-content:space-between; align-items:center; gap:16px; } h1 { margin:0; font-size:26px; } h2 { margin:0 0 12px; font-size:19px; } p { line-height:1.55; } .muted { color:var(--muted); } .nav { display:flex; gap:8px; overflow:auto; padding:20px 0 16px; } .tab { flex:0 0 auto; border:0; border-radius:999px; background:#e4eee7; color:var(--ink); padding:10px 14px; font:inherit; cursor:pointer; } .tab[aria-selected="true"] { background:var(--ink); color:white; } .panel { display:none; } .panel.active { display:block; } .grid { display:grid; gap:14px; grid-template-columns:repeat(12,1fr); } .card { grid-column:span 12; padding:18px; border:1px solid var(--line); border-radius:16px; background:var(--card); box-shadow:0 3px 16px #173d2a0a; } .hero { color:white; background:linear-gradient(135deg,#173d2a,#2c8054); } .score { font-size:44px; font-weight:800; } .progress { height:8px; overflow:hidden; border-radius:99px; background:#d9eadf; } .progress>span { display:block; height:100%; border-radius:inherit; background:var(--green); } .hero .progress { background:#ffffff44; } .hero .progress>span { background:#b6f3c4; }
    .actions { display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)); } button, input { font:inherit; } .action, .primary, .secondary { min-height:48px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:white; color:var(--ink); cursor:pointer; } .action.done { border-color:var(--ink); background:var(--ink); color:white; } .action:disabled { opacity:.65; cursor:not-allowed; } .primary { color:white; background:var(--green); border-color:var(--green); } .secondary { background:#f3f8f4; } .measurements { display:grid; gap:10px; grid-template-columns:1fr 1fr auto; } input { width:100%; min-height:48px; border:1px solid var(--line); border-radius:10px; padding:0 12px; } .fluid-group { display:grid; gap:12px; padding:14px 0; } .fluid-group+.fluid-group { border-top:1px solid var(--line); } .fluid-group label { display:grid; gap:7px; color:var(--ink); font-weight:700; } .fluid-group output { justify-self:end; color:var(--muted); font-weight:400; } .fluid-group input[type="range"] { min-height:auto; padding:0; accent-color:var(--green); } dialog { width:min(440px,calc(100% - 28px)); border:0; border-radius:16px; box-shadow:0 16px 42px #0004; } dialog::backdrop { background:#173d2a66; } .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; } .notice { padding:12px; border-radius:10px; background:#fff6e6; color:#77531c; } .list { display:grid; gap:9px; } .item { padding:12px; border-radius:10px; background:#f7faf8; } .pwa-status { margin:10px 0; padding:10px 12px; border-radius:10px; color:#276742; background:var(--mint); } .pwa-status.offline { color:#77531c; background:#fff6e6; } .install-banner { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:12px 0; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); } .install-banner span { flex:1 1 210px; } .install-banner .primary,.install-banner .secondary { min-height:42px; } .week-overview { display:grid; grid-template-columns:repeat(7,minmax(92px,1fr)); gap:8px; overflow-x:auto; padding-bottom:4px; } .day-card { min-width:92px; min-height:104px; padding:10px; border:1px solid var(--line); border-radius:12px; color:var(--ink); text-align:left; background:white; cursor:pointer; } .day-card.selected { border-color:var(--green); background:var(--mint); box-shadow:inset 0 0 0 1px var(--green); } .day-card.today:not(.selected) { border-style:dashed; } .day-card strong,.day-card small { display:block; } .day-card small { margin-top:6px; color:var(--muted); line-height:1.35; } .plan-section { margin-top:18px; } .plan-section h3 { margin:0 0 8px; } .plan-table { width:100%; border-collapse:collapse; font-size:14px; } .plan-table td,.plan-table th { padding:9px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; } .metric-group { margin-top:22px; } .metric-group h2 { margin-bottom:4px; } .metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .metric-card { min-height:136px; padding:13px; border:1px solid var(--line); border-radius:13px; background:#fff; } .metric-name { color:var(--muted); font-size:13px; } .metric-value { margin:5px 0; color:var(--ink); font-size:24px; font-weight:750; } .metric-trend { min-height:20px; color:var(--muted); font-size:12px; } .trend-svg { display:block; width:100%; height:34px; margin-top:7px; } .metric-empty { color:var(--muted); font-size:14px; line-height:1.5; } .snackbar { position:fixed; left:50%; bottom:20px; z-index:3; display:none; align-items:center; gap:18px; min-width:280px; padding:13px 16px; border-radius:12px; transform:translateX(-50%); color:white; background:#173d2a; box-shadow:0 10px 28px #0004; } .snackbar.show { display:flex; } .snackbar button { border:0; color:#b6f3c4; background:transparent; font-weight:700; cursor:pointer; } [hidden] { display:none !important; } #status { min-height:20px; margin:10px 0; color:var(--danger); } .table { width:100%; border-collapse:collapse; } .table td,.table th { padding:10px 6px; border-bottom:1px solid var(--line); text-align:left; } .photo-input { display:none; }
    @media (min-width:760px) { .half { grid-column:span 6; } .third { grid-column:span 4; } .actions { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:500px) { .measurements { grid-template-columns:1fr 1fr; } .measurements .primary { grid-column:span 2; } header .muted { display:none; } }
  </style>
</head>
<body>
  <main class="page">
    <header><div><p class="muted">健康管理 / 腹型减脂</p><h1>今天，先完成最重要的一件事</h1></div><a class="secondary" href="/">项目首页</a></header>
    <nav class="nav" aria-label="健康管理导航">
      <button class="tab" type="button" data-tab="today" aria-selected="true">今日</button><button class="tab" type="button" data-tab="plan">计划</button><button class="tab" type="button" data-tab="diet">饮食</button><button class="tab" type="button" data-tab="trends">趋势</button><button class="tab" type="button" data-tab="compare">计划 vs 实际</button><button class="tab" type="button" data-tab="report">周报</button><button class="tab" type="button" data-tab="settings">设置</button>
    </nav>
    <div id="pwaStatus" class="pwa-status" role="status" aria-live="polite" hidden></div>
    <div id="installHealthApp" class="install-banner" hidden><span>添加“减脂管理”到手机桌面，打开更快捷。</span><button id="installHealthButton" class="primary" type="button">安装减脂管理</button><button id="dismissInstall" class="secondary" type="button">暂不</button></div>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="today" class="panel active" aria-label="今日">
      <div class="grid"><article class="card hero half"><div class="muted" style="color:#d6edda">今日完成度</div><div id="completion" class="score">--%</div><div class="progress"><span id="completionBar" style="width:0"></span></div><p id="remaining">正在读取今日任务…</p></article><article id="hydrationCard" class="card half"><h2>饮水 / 喝茶</h2><section class="fluid-group" aria-label="饮水记录"><label>饮水 <output id="waterMl">0 ml</output><input data-fluid-slider="water" type="range" min="0" max="5000" step="100" value="0" aria-label="饮水毫升数" /></label><div class="actions"><button class="action" data-hydration="200" type="button">水 +200 ml</button><button class="action" data-hydration="500" type="button">水 +500 ml</button><button class="action" data-hydration="1000" type="button">水 +1000 ml</button></div></section><section class="fluid-group" aria-label="喝茶记录"><label>喝茶 <output id="teaMl">0 ml</output><input data-fluid-slider="tea" type="range" min="0" max="5000" step="100" value="0" aria-label="喝茶毫升数" /></label><div class="actions"><button class="action" data-tea="200" type="button">茶 +200 ml</button><button class="action" data-tea="500" type="button">茶 +500 ml</button><button class="action" data-tea="1000" type="button">茶 +1000 ml</button></div></section></article>
        <article class="card"><h2>今日事项</h2><p id="highlight">加载中…</p><div id="todaySchedule" class="actions" aria-live="polite"></div></article>
        <article id="notificationCard" class="card" hidden><h2>站内提醒</h2><div id="notifications" class="list"></div></article>
      </div>
    </section>
    <section id="plan" class="panel"><article class="card"><h2>一周总览</h2><p class="muted">点击日期查看当天的时间表和训练详情。</p><div id="weekOverview" class="week-overview" aria-label="一周计划"></div><div id="planDetail" class="plan-section" aria-live="polite"></div></article></section>
    <section id="diet" class="panel"><article class="card"><h2>饮食记录</h2><p>三餐照片显示为“待 AI 分析”；接入 AI 前不会展示推测的食物或营养素。</p><div id="dietView" class="list"></div></article></section>
    <section id="trends" class="panel"><article class="card"><h2>健康指标趋势</h2><p class="muted">已接入指标展示当前值与近 28 天趋势；未接入项不会生成估算数据。</p><div id="trendView"></div></article></section>
    <section id="compare" class="panel"><article class="card"><h2>计划 vs 实际</h2><div id="compareView"></div></article></section>
    <section id="report" class="panel"><article class="card"><h2>自动周报</h2><div id="reportView" class="list"></div></article></section>
    <section id="settings" class="panel"><article class="card"><h2>设置</h2><div class="measurements"><input id="hydrationTarget" type="number" min="500" max="5000" step="100" aria-label="每日饮水目标" /><input id="cutoff" type="time" aria-label="训练归属截止时间" value="01:00" /><label class="action"><input id="massageEnabled" type="checkbox" /> 显示揉腹舒适辅助</label><button id="saveSettings" class="primary" type="button">保存设置</button></div><p class="muted">揉腹仅用于腹胀/便秘时的舒适辅助，不计入减脂评分。</p></article></section>
  </main>
  <input id="mealPhotoInput" class="photo-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" />
  <dialog id="measurementDialog" aria-labelledby="measurementDialogTitle"><form id="measurementForm"><h2 id="measurementDialogTitle">身体记录</h2><p class="muted">填写体重或腰围后保存即可。</p><div class="measurements"><input id="weightKg" type="number" min="20" max="400" step="0.1" inputmode="decimal" placeholder="体重 kg" aria-label="体重 kg" /><input id="waistCm" type="number" min="30" max="250" step="0.1" inputmode="decimal" placeholder="腰围 cm" aria-label="腰围 cm" /></div><div class="dialog-actions"><button id="cancelMeasurement" class="secondary" type="button">取消</button><button id="saveMeasurement" class="primary" type="submit">保存</button></div></form></dialog>
  <div id="snackbar" class="snackbar"><span id="snackbarText"></span><button id="undoButton" type="button">撤销</button></div>
  <script type="module" src="/health-client.js"></script>
</body>
</html>
